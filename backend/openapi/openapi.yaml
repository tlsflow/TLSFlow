  /api/v1/health:
    get:
      operationId: "getHealth"
      summary: "健康检查"
      tags:
        - "Health"
      responses:
        200:
          description: "成功"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "status"
                  - "service"
                  - "version"
                  - "timestamp"
                properties:
                  status:
                    type: "string"
                    enum:
                      - "OK"
                      - "DEGRADED"
                  service:
                    type: "string"
                  version:
                    type: "string"
                  timestamp:
                    type: "string"
                    format: "date-time"
                  dependencies:
                    type: "object"
                    additionalProperties:
                      type: "string"
        400:
          $ref: "#/components/responses/ErrorResponse"
        404:
          $ref: "#/components/responses/ErrorResponse"
        500:
          $ref: "#/components/responses/ErrorResponse"
