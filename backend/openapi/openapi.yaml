  /api/v1/tenants/architecture:
    get:
      operationId: "getTenantArchitecture"
      summary: "查询租户架构聚合"
      tags:
        - "Security"
      responses:
        200:
          description: "成功"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "mode"
                  - "currentTenantId"
                  - "contextVersion"
                  - "roots"
                properties:
                  mode:
                    type: "string"
                    enum:
                      - "single"
                      - "hierarchical"
                  currentTenantId:
                    type: "string"
                  contextVersion:
                    type: "string"
                  managementScope:
                    type: "object"
                    required:
                      - "type"
                    properties:
                      type:
                        type: "string"
                        enum:
                          - "SELF"
                          - "SUBTREE"
                          - "EXPLICIT"
                          - "SYSTEM"
                      rootTenantId:
                        type: "string"
                      tenantIds:
                        type: "array"
                        items:
                          type: "string"
                    additionalProperties: false
                  roots:
                    type: "array"
                    items:
                      type: "object"
                      required:
                        - "id"
                        - "name"
                        - "code"
                        - "type"
                        - "status"
                        - "current"
                        - "administrators"
                        - "children"
                      properties:
                        id:
                          type: "string"
                        name:
                          type: "string"
                        code:
                          type: "string"
                        type:
                          type: "string"
                          enum:
                            - "GROUP"
                            - "COMPANY"
                        parentId:
                          type: "string"
                        status:
                          type: "string"
                          enum:
                            - "ACTIVE"
                            - "SUSPENDED"
                        current:
                          type: "boolean"
                        administrators:
                          type: "array"
                          items:
                            type: "object"
                            required:
                              - "membershipId"
                              - "subjectType"
                              - "subjectId"
                              - "displayName"
                              - "membershipType"
                              - "status"
                              - "effectiveFrom"
                            properties:
                              membershipId:
                                type: "string"
                              subjectType:
                                type: "string"
                                enum:
                                  - "user"
                                  - "group"
                                  - "external_group"
                              subjectId:
                                type: "string"
                              displayName:
                                type: "string"
                              username:
                                type: "string"
                              membershipType:
                                type: "string"
                                enum:
                                  - "owner"
                                  - "admin"
                              status:
                                type: "string"
                                enum:
                                  - "ACTIVE"
                              effectiveFrom:
                                type: "string"
                                format: "date-time"
                              effectiveUntil:
                                type: "string"
                                format: "date-time"
                            additionalProperties: false
                        administratorsTruncated:
                          type: "boolean"
                        children:
                          type: "array"
                          items:
                            type: "object"
                            required:
                              - "id"
                              - "name"
                              - "code"
                              - "type"
                              - "status"
                              - "current"
                              - "administrators"
                              - "children"
                            properties:
                              id:
                                type: "string"
                              name:
                                type: "string"
                              code:
                                type: "string"
                              type:
                                type: "string"
                                enum:
                                  - "COMPANY"
                              parentId:
                                type: "string"
                              status:
                                type: "string"
                                enum:
                                  - "ACTIVE"
                                  - "SUSPENDED"
                              current:
                                type: "boolean"
                              administrators:
                                type: "array"
                                items:
                                  type: "object"
                                  required:
                                    - "membershipId"
                                    - "subjectType"
                                    - "subjectId"
                                    - "displayName"
                                    - "membershipType"
                                    - "status"
                                    - "effectiveFrom"
                                  properties:
                                    membershipId:
                                      type: "string"
                                    subjectType:
                                      type: "string"
                                      enum:
                                        - "user"
                                        - "group"
                                        - "external_group"
                                    subjectId:
                                      type: "string"
                                    displayName:
                                      type: "string"
                                    username:
                                      type: "string"
                                    membershipType:
                                      type: "string"
                                      enum:
                                        - "owner"
                                        - "admin"
                                    status:
                                      type: "string"
                                      enum:
                                        - "ACTIVE"
                                    effectiveFrom:
                                      type: "string"
                                      format: "date-time"
                                    effectiveUntil:
                                      type: "string"
                                      format: "date-time"
                                  additionalProperties: false
                              administratorsTruncated:
                                type: "boolean"
                              children:
                                type: "array"
                                maxItems: 0
                            additionalProperties: false
                      additionalProperties: false
                additionalProperties: false
