openapi: "3.1.0"
info:
  title: "GCAC 后端 API"
  version: "v1"
  description: "企业 SSL 证书生命周期管理平台后端 API 契约。"
servers:
  -
    url: "/api/v1"
paths:
  /api/v1/health:
    get:
      operationId: "getHealth"
      summary: "健康检查"
      tags:
        - "Health"
      responses:
        200:
          description: "成功"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "status"
                  - "service"
                  - "version"
                  - "timestamp"
                  - "deploymentArchitecture"
                  - "features"
                properties:
                  status:
                    type: "string"
                    enum:
                      - "OK"
                      - "DEGRADED"
                  service:
                    type: "string"
                  version:
                    type: "string"
                  timestamp:
                    type: "string"
                    format: "date-time"
                  dependencies:
                    type: "object"
                    additionalProperties:
                      type: "string"
                  deploymentArchitecture:
                    type: "string"
                    enum:
                      - "small"
                      - "standard"
                  features:
                    type: "object"
                    required:
                      - "browserRuntime"
                    properties:
                      browserRuntime:
                        type: "boolean"
                    additionalProperties: false
        400:
          $ref: "#/components/responses/ErrorResponse"
        404:
          $ref: "#/components/responses/ErrorResponse"
        500:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/system/initialization:
    get:
      operationId: "getSystemInitializationStatus"
      summary: "查询系统初始化状态"
      tags:
