name: sync-public-repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH credentials
        shell: bash
        env:
          GITHUB_DEPLOY_KEY: ${{ secrets.GITHUB_DEPLOY_KEY }}
          GITHUB_KNOWN_HOSTS: ${{ secrets.GITHUB_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$GITHUB_DEPLOY_KEY"
          test -n "$GITHUB_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$GITHUB_DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$GITHUB_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Sync approved public commit
        shell: bash
        env:
          GITHUB_REPOSITORY_URL: ${{ secrets.GITHUB_REPOSITORY_URL }}
          PUBLIC_RELEASE_TARGET_BRANCH: main
          # 公开 Gitea main 受保护分支，合并即代表已完成人工审核。
          PUBLIC_RELEASE_APPROVED: "true"
        run: |
          set -eu
          test -n "$GITHUB_REPOSITORY_URL"
          node scripts/public-release/sync-github.mjs
