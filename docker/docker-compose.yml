# User deployment entrypoint: pull prebuilt tlsflow/* images from Docker Hub.
name: gcac

services:
  db:
    labels:
      com.gcac.deployment.architecture: standard
    image: ${GCAC_DB_IMAGE:-tlsflow/tlsflow-db:postgres16}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gcac}
      POSTGRES_USER: ${POSTGRES_USER:-gcac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ${GCAC_DATA_ROOT:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    labels:
      com.gcac.deployment.architecture: standard
    image: tlsflow/tlsflow-backend:${GCAC_RELEASE_VERSION:?GCAC_RELEASE_VERSION is required}
    environment:
      GCAC_DATABASE_NAME: ${POSTGRES_DB:-gcac}
      GCAC_DATABASE_USER: ${POSTGRES_USER:-gcac}
      GCAC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      GCAC_PUBLIC_BASE_URL: ${GCAC_PUBLIC_BASE_URL:?GCAC_PUBLIC_BASE_URL is required}
      GCAC_TOKEN_SECRET: ${GCAC_TOKEN_SECRET:?GCAC_TOKEN_SECRET is required}
      GCAC_SECRET_KEK: ${GCAC_SECRET_KEK:?GCAC_SECRET_KEK is required}
      BROWSER_RUNTIME_SHARED_SECRET: ${BROWSER_RUNTIME_SHARED_SECRET:-}
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 4g
    cpus: 2
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${GCAC_DATA_ROOT:-./data}/workflows:/app/data/workflows
      - ${GCAC_DATA_ROOT:-./data}/runtime:/app/data/runtime
      - ${GCAC_DATA_ROOT:-./data}/tls-inspector:/app/data/tls-inspector
      - ${GCAC_DATA_ROOT:-./data}/plugins:/app/data/plugins:ro
    restart: unless-stopped

  web:
    labels:
      com.gcac.deployment.architecture: standard
    image: tlsflow/tlsflow-web:${GCAC_RELEASE_VERSION:?GCAC_RELEASE_VERSION is required}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${GCAC_PORT:-8085}:80"
    restart: unless-stopped

  browser-runtime:
    profiles: ["true", "browser-runtime"]
    labels:
      com.gcac.deployment.architecture: standard
    image: tlsflow/tlsflow-browser-runtime:${GCAC_RELEASE_VERSION:?GCAC_RELEASE_VERSION is required}
    environment:
      BROWSER_RUNTIME_SHARED_SECRET: ${BROWSER_RUNTIME_SHARED_SECRET:-}
      BROWSER_RUNTIME_PUBLIC_BASE_URL: ${BROWSER_RUNTIME_PUBLIC_BASE_URL:-}
      BROWSER_SESSION_ROOT: /run/gcac-browser-sessions
      BROWSER_SESSION_SCRIPT: /app/container/start-session.sh
      BROWSER_CHROMIUM_EXECUTABLE: /usr/bin/chromium
      BROWSER_NOVNC_ROOT: /app/novnc
    read_only: true
    tmpfs:
      - /run/gcac-browser-sessions:rw,noexec,nosuid,uid=10001,gid=10001,mode=0700,size=512m
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    expose:
      - "8787"
    restart: unless-stopped
